# A site whose certificate expires soon (the lab creates a 5-day certificate),
# so the Upcoming panel and its alerts can be tested without waiting a year.
server {
  listen 443 ssl;
  server_name localhost;
  ssl_certificate /lab/tls/cert.pem;
  ssl_certificate_key /lab/tls/key.pem;
  location / { return 200 "lab site\n"; }
}
