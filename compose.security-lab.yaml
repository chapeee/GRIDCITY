# GRIDCITY attack lab: a target server and attackers on a private network,
# to prove that attacks show up in the city. Every attack stays inside this
# network; only the target's SSH port is published, on 127.0.0.1.
#
#   node scripts/security-lab.mjs up          # build, start, print how to add the target
#   node scripts/security-lab.mjs attack      # brute force, guessed password, backdoor, open port
#   node scripts/security-lab.mjs down
#
# Never run the target anywhere reachable from a network: it has a weak password on purpose.

name: gridcity-security-lab

networks:
  lab:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1

services:
  target:
    build: scripts/security-lab/target
    hostname: lab-target
    cap_add: [NET_ADMIN] # Fail2ban bans with iptables inside the container
    ports: ['127.0.0.1:2222:22']
    volumes:
      - ./scripts/security-lab/.keys/gridcity_lab.pub:/lab/authorized_keys:ro
    networks:
      lab: { ipv4_address: 172.31.250.10 }

  attacker:
    build: scripts/security-lab/attacker
    networks:
      lab: { ipv4_address: 172.31.250.20 }

  attacker2:
    build: scripts/security-lab/attacker
    networks:
      lab: { ipv4_address: 172.31.250.21 }

  # An HTTPS site whose certificate expires in 5 days (created by security-lab.mjs up).
  short-cert-site:
    image: nginx:stable-trixie-perl
    ports: ['127.0.0.1:18443:443']
    volumes:
      - ./scripts/security-lab/tls-site/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./scripts/security-lab/.keys/tls:/lab/tls:ro
    networks: [lab]

  # A container that crashes a few seconds after every start: a crash loop to detect.
  crasher:
    image: redis:7.4-alpine
    entrypoint: ['sh', '-c', 'echo starting; sleep 8; echo "cannot connect to database"; exit 3']
    restart: always
    networks: [lab]

  # Redis with no password and protected mode off: an exposure GRIDCITY must flag.
  open-redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--protected-mode', 'no']
    ports: ['127.0.0.1:16380:6379']
    networks: [lab]
