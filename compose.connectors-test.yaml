# Real database and storage instances for the connector tests.
#
#   npm run test:connectors          start these, run the tests, keep them running
#   npm run test:connectors -- --down   also stop and remove them afterwards
#
# Ports are published on 127.0.0.1 only, on unusual numbers so they do not clash
# with databases you already run. Passwords here are throwaway test values for
# these containers only; the app itself never stores a password.
#
# SQL Server is large and x64-only, so it has its own profile:
#   docker compose -f compose.connectors-test.yaml --profile mssql up -d --wait

name: connectors-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: test-root
    command: ['postgres', '-c', 'shared_preload_libraries=']
    volumes:
      - ./scripts/connectors-test/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ['127.0.0.1:15432:5432']
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test-root
    volumes:
      - ./scripts/connectors-test/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ['127.0.0.1:13306:3306']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-ptest-root']
      interval: 3s
      retries: 60

  # Like a managed MySQL: TLS required, certificate signed by its own auto-generated CA.
  # The Doctor tests reproduce "insecure transport are prohibited" and its chain of fixes here.
  mysql-tls:
    image: mysql:8.4
    command: ['--require_secure_transport=ON']
    environment:
      MYSQL_ROOT_PASSWORD: test-root
    volumes:
      - ./scripts/connectors-test/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ['127.0.0.1:13307:3306']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-ptest-root']
      interval: 3s
      retries: 60

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: test-root
    volumes:
      - ./scripts/connectors-test/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports: ['127.0.0.1:27018:27017']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 3s
      retries: 40

  redis:
    image: redis:7.4-alpine
    # 'monitor' gets only what the connector needs (see the ACL file).
    command: ['redis-server', '--aclfile', '/etc/redis/users.acl']
    volumes:
      - ./scripts/connectors-test/redis-users.acl:/etc/redis/users.acl:ro
    ports: ['127.0.0.1:16379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'test-root', '--no-auth-warning', 'ping']
      interval: 2s
      retries: 30

  # MinIO no longer publishes pullable official images; pgsty/minio is a
  # maintained community build of the same open-source MinIO server.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: test-minio
      MINIO_ROOT_PASSWORD: test-minio-secret
    ports: ['127.0.0.1:19000:9000']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [mssql]
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Test-root-1234
    ports: ['127.0.0.1:11433:1433']
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Test-root-1234 -Q "SELECT 1" || exit 1
      interval: 5s
      retries: 40
